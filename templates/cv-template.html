<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Name}} - CV</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background: white;
        }
        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
            color: #111;
        }
        h1 {
            font-size: 24pt;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .contact-info {
            font-size: 10pt;
            color: #555;
            margin-bottom: 25px;
            border-bottom: 2px solid #111;
            padding-bottom: 15px;
        }
        .contact-info span {
            margin-right: 15px;
        }
        h2 {
            font-size: 14pt;
            text-transform: uppercase;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        h3 {
            font-size: 12pt;
            margin-bottom: 5px;
        }
        p {
            margin-top: 0;
            margin-bottom: 15px;
        }
        ul {
            margin-top: 0;
            padding-left: 20px;
            margin-bottom: 15px;
        }
        li {
            margin-bottom: 5px;
        }
        .summary {
            font-size: 11pt;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header>
        <h1>{{.Name}}</h1>
        <div class="contact-info">
            <span>{{.Location}}</span>
            <span>{{.Phone}}</span>
            <span>{{.Email}}</span>
            <span>{{.LinkedIn}}</span>
        </div>
    </header>

    <section>
        <h2>Professional Summary</h2>
        <p class="summary">{{.Summary}}</p>
    </section>

    <section>
        <h2>Experience</h2>
        <ul>
            {{range .Experience}}
            <li>{{.}}</li>
            {{end}}
        </ul>
    </section>

</body>
</html>
